
<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>اسماك اخوين</title>

    <meta
        name="description"
        content="Découvrez notre boutique et contactez-nous facilement."
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>

<main class="profile">


    <!-- =====================================================
         THEME TOGGLE
    ====================================================== -->

    <button
        id="themeToggle"
        class="theme-toggle"
        type="button"
        aria-label="Changer le mode"
    >

        <span class="toggle-track">

            <span class="toggle-icon moon">
                <i class="fa-solid fa-moon"></i>
            </span>

            <span class="toggle-icon sun">
                <i class="fa-solid fa-sun"></i>
            </span>

            <span class="toggle-thumb"></span>

        </span>

    </button>



    <!-- =====================================================
         HERO
    ====================================================== -->

    <section class="hero">

    


        <div class="profile-content">

            <div class="logo-wrapper">

                <img
                    id="logoImage"
                    src="images/logo.png"
                    alt="Logo"
                >

            </div>


            <h1 id="businessName">
                اسماك اخوين
            </h1>


            <p id="businessDescription">
                بيع الاسماك الطرية
            </p>


    

        </div>

    </section>



    <!-- =====================================================
         QUICK ACTIONS
    ====================================================== -->

    <section class="actions">


        <!-- PHONE -->

        <a
            id="phoneBtn"
            class="action-card"
            href="#"
        >

            <div class="icon">

                <i class="fa-solid fa-phone"></i>

            </div>

            <span>
                Appeler
            </span>

        </a>



        <!-- WHATSAPP -->

        <a
            id="whatsappBtn"
            class="action-card whatsapp"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >

            <div class="icon">

                <i class="fa-brands fa-whatsapp"></i>

            </div>

            <span>
                WhatsApp
            </span>

        </a>



        <!-- INSTAGRAM -->

        <a
            id="instagramBtn"
            class="action-card"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >

            <div class="icon">

                <i class="fa-brands fa-instagram"></i>

            </div>

            <span>
                Instagram
            </span>

        </a>



        <!-- FACEBOOK -->

        <a
            id="facebookBtn"
            class="action-card"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >

            <div class="icon">

                <i class="fa-brands fa-facebook-f"></i>

            </div>

            <span>
                Facebook
            </span>

        </a>

    </section>



    <!-- =====================================================
         CONTACT
    ====================================================== -->

    <section class="section">

        <div class="section-title">

            <span></span>

            <h2>
                Contact
            </h2>

            <span></span>

        </div>


        <!-- PHONE -->

        <div class="info-card">

            <div class="info-icon">

                <i class="fa-solid fa-phone"></i>

            </div>


            <div class="info-text">

                <small>
                    Téléphone
                </small>

                <strong id="phoneNumber">
                    +212 6 53 29 16 84
                </strong>

            </div>


            <a
                id="callLink"
                href="#"
                class="small-action"
                aria-label="Appeler"
            >

                <i class="fa-solid fa-arrow-up-right-from-square"></i>

            </a>

        </div>



        <!-- WHATSAPP -->

        <div class="info-card">

            <div class="info-icon">

                <i class="fa-brands fa-whatsapp"></i>

            </div>


            <div class="info-text">

                <small>
                    WhatsApp
                </small>

                <strong id="whatsappNumber">
                    +212 6 53 29 16 84
                </strong>

            </div>


            <a
                id="whatsappLink"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="small-action"
                aria-label="WhatsApp"
            >

                <i class="fa-solid fa-arrow-up-right-from-square"></i>

            </a>

        </div>

    </section>



    <!-- =====================================================
         SOCIAL NETWORKS
    ====================================================== -->

    <section class="section">

        <div class="section-title">

            <span></span>

            <h2>
                Nos réseaux
            </h2>

            <span></span>

        </div>


        <div class="social-list">


            <!-- INSTAGRAM -->

            <a
                id="instagramLink"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="social-item"
            >

                <div>

                    <i class="fa-brands fa-instagram"></i>

                </div>

                <span>
                    Instagram
                </span>

                <i class="fa-solid fa-chevron-right"></i>

            </a>



            <!-- FACEBOOK -->

            <a
                id="facebookLink"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="social-item"
            >

                <div>

                    <i class="fa-brands fa-facebook-f"></i>

                </div>

                <span>
                    Facebook
                </span>

                <i class="fa-solid fa-chevron-right"></i>

            </a>

        </div>

    </section>






    <!-- =====================================================
         ADD CONTACT
    ====================================================== -->

    <section class="add-contact">

        <button
            id="saveContactBtn"
            type="button"
        >

            <i class="fa-solid fa-user-plus"></i>

            <span>
                Ajouter aux contacts
            </span>

        </button>

    </section>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <p id="footerName">
            اسماك اخوين
        </p>


        <small>
            Digital Business Profile powered by
        </small>


        <a
            href="https://next-tap.app"
            target="_blank"
            rel="noopener noreferrer"
        >

            <strong>
                Next-Tap
            </strong>

        </a>

    </footer>

</main>



<!-- =====================================================
     DATA
====================================================== -->

<script src="data.js"></script>


<!-- =====================================================
     MAIN SCRIPT
====================================================== -->

<script src="script.js"></script>


</body>

</html>
